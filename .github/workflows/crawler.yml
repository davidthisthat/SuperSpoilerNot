name: SRF Crawler

on:
  workflow_dispatch:

  # Alle 15 Minuten während der Saison (GitHub-Minuten schonen)
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Results
        run: npm run results

      - name: Run Crawler
        run: npm run crawl

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code links.json spielplan.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add links.json spielplan.json
          git commit -m "Update links und Resultate"
          git push
